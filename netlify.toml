[build]
  command = "npm run build:netlify"
  publish = "netlify-public"

[build.environment]
  NODE_VERSION = "22"

# Add a /api/* HTTPS backend proxy only after the separate public backend
# is configured, secured and tested. Never point this at localhost.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache"

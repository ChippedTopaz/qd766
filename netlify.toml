[build]
  command = "npm run build:netlify"
  publish = "netlify-public"

[build.environment]
  NODE_VERSION = "22"

# Browser uses same-origin API/cookies. Only the protected 8769 tunnel is upstream.
# Before testing Google on bochiso766.com, register its callback and update
# .env.public GOOGLE_REDIRECT_URI; never expose office 8767 or its configuration.
[[redirects]]
  from = "/api/*"
  to = "https://api.bochiso766.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache"

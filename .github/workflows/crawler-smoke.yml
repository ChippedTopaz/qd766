name: Crawler Smoke Test

on:
  workflow_dispatch:
    inputs:
      province:
        description: 'Province code to test (for example H05)'
        required: true
        default: H05
      headed:
        description: 'Run with headed browser (normally false on Actions)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: crawler-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          playwright install --with-deps chromium

      - name: Run single-province smoke test
        run: |
          python tools/crawl_catalog.py \
            --year 2026 \
            --province-code "${{ inputs.province }}" \
            --force

      - name: Show generated files
        if: always()
        run: |
          find data -maxdepth 5 -type f -print 2>/dev/null || true
